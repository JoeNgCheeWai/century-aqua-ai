# PR check: every pull request must lint and build the frontend before it can be merged.
#
# This is the safety net for the autonomous workflow (Phase 6.6): the CTO and CMO can open pull requests but can never merge
# one. A human merges, and this check tells the human whether the change at least builds.
#
# It runs on pull requests from branches in THIS repository, with no secrets, so the build must not need any. If a
# build ever fails here only because an environment variable is missing, add a harmless placeholder under `env:` below,
# never a real key.

name: PR check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json says (and fails if it is out of step with package.json), which is
      # what a check should do. It also runs the postinstall script (prisma generate).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
