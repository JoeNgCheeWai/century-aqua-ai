services:
  - type: web
    name: caip-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # you enter this in the Render dashboard
      - key: GATEKEEPER_MODEL
        value: claude-haiku-5-5
      - key: SPECIALIST_MODEL
        value: claude-sonnet-5-5
      - key: CAO_MODEL
        value: claude-sonnet-5-5
      - key: CAO_MAX_TOKENS
        value: "8192"        # Phase 1: one answer carries the recommendation, reasoning chain and 3 scenarios
      - key: COO_MODEL
        value: claude-sonnet-5-5
      - key: COO_MAX_TOKENS
        value: "16384"       # Phase 2: the COO also writes a stress test of the CAO plan
      - key: CTO_MODEL
        value: claude-sonnet-5-5
      - key: CTO_MAX_TOKENS
        value: "16384"       # Phase 3: the CTO's answer can also carry a code diff in its authorization_request
      - key: CMO_MODEL
        value: claude-sonnet-5-5
      - key: CMO_MAX_TOKENS
        value: "16384"       # Phase 4: the CMO's answer carries drafted assets plus the content to publish
      - key: INTERNAL_CAO_KEY
        sync: false          # secret; required to enable the internal-only /api/cao endpoint
      - key: INTERNAL_COO_KEY
        sync: false          # secret; required to enable the internal-only /api/coo endpoint (64-char hex)
      - key: INTERNAL_CTO_KEY
        sync: false          # secret; required to enable the internal-only /api/cto endpoint (64-char hex)
      - key: INTERNAL_CMO_KEY
        sync: false          # secret; required to enable the internal-only /api/cmo endpoint (64-char hex)
      - key: INTERNAL_COUNCIL_KEY
        sync: false          # secret; required to enable the internal-only /api/council endpoints (64-char hex, different from the agent keys)
      - key: COUNCIL_MODEL
        value: claude-sonnet-5-5
      # Phase 6.5 model tiers: what "haiku", "sonnet" and "opus" mean in the Mission Control model picker. Optional (these are the defaults).
      - key: HAIKU_MODEL
        value: claude-haiku-5-5
      - key: SONNET_MODEL
        value: claude-sonnet-5-5
      - key: OPUS_MODEL
        value: claude-opus-5-5
      # Phase 6.6: the fine-grained GitHub token the tool router uses to open pull requests (never to merge). Backend only.
      - key: GITHUB_PAT
        sync: false          # secret; Contents and Pull requests read/write on the one repository
      # Phase 6 Mission Control: ADMIN_PIN and ADMIN_SESSION_SECRET are read by the Next.js FRONTEND (Vercel), not by this
      # backend. They are listed here as the project's record of every secret; set the same two on the frontend host.
      # The backend's Mission Control endpoints (/api/audit-logs, /api/authorization/*, /api/council/sessions) use
      # INTERNAL_COUNCIL_KEY above. ADMIN_PIN: the login PIN (6+ chars). ADMIN_SESSION_SECRET: 64-char hex that signs the cookie.
      - key: ADMIN_PIN
        sync: false          # secret; the Mission Control login PIN (frontend host)
      - key: ADMIN_SESSION_SECRET
        sync: false          # secret; random 64-char hex signing the Mission Control session cookie (frontend host)
      - key: GOVERNANCE_DATABASE_URL
        sync: false          # secret; the Neon URL. Enables the audit log, agent state and kill switch
      - key: PINECONE_API_KEY
        sync: false          # secret; AI_CAO knowledge base (RAG)
      - key: PINECONE_INDEX
        sync: false          # index name (dimension 1536, cosine)
      - key: OPENAI_API_KEY
        sync: false          # secret; used only for text-embedding-3-small
      - key: ALLOWED_ORIGINS
        sync: false          # your Vercel production URL(s), comma-separated
      - key: ALLOWED_ORIGIN_REGEX
        sync: false          # optional: regex matching Vercel preview URLs
